<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rotating Product Cube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="cube-container">
        <div class="cube">
            <!-- Front Face -->
            <div class="face front">
                <div class="product-grid">
                    <div class="product-card"><img src="img/product1" alt="Product Image"><div class="product-name">Product 1</div></div>
                    <div class="product-card"><img src="img/product2" alt="Product Image"><div class="product-name">Product 2</div></div>
                    <div class="product-card"><img src="img/product3" alt="Product Image"><div class="product-name">Product 3</div></div>
                    <div class="product-card"><img src="img/product4" alt="Product Image"><div class="product-name">Product 4</div></div>
                    <div class="product-card"><img src="img/product5" alt="Product Image"><div class="product-name">Product 5</div></div>
                    <div class="product-card"><img src="img/product6" alt="Product Image"><div class="product-name">Product 6</div></div>
                    <div class="product-card"><img src="img/product7" alt="Product Image"><div class="product-name">Product 7</div></div>
                    <div class="product-card"><img src="img/product8" alt="Product Image"><div class="product-name">Product 8</div></div>
                    <div class="product-card"><img src="img/product9" alt="Product Image"><div class="product-name">Product 9</div></div>
                    <div class="product-card"><img src="img/product10" alt="Product Image"><div class="product-name">Product 10</div></div>
                    <div class="product-card"><img src="img/product11" alt="Product Image"><div class="product-name">Product 11</div></div>
                    <div class="product-card"><img src="img/product12" alt="Product Image"><div class="product-name">Product 12</div></div>
                    <div class="product-card"><img src="img/product13" alt="Product Image"><div class="product-name">Product 13</div></div>
                    <div class="product-card"><img src="img/product14" alt="Product Image"><div class="product-name">Product 14</div></div>
                    <div class="product-card"><img src="img/product15" alt="Product Image"><div class="product-name">Product 15</div></div>
                    <div class="product-card"><img src="img/product16" alt="Product Image"><div class="product-name">Product 16</div></div>
                </div>
            </div>
            <!-- Repeat for other faces with new random numbers -->
            <div class="face back">
                <div class="product-grid">
                    <div class="product-card"><img src="product17" alt="Product Image"><div class="product-name">Product 17</div></div>
                    <div class="product-card"><img src="product18" alt="Product Image"><div class="product-name">Product 18</div></div>
                    <div class="product-card"><img src="product19" alt="Product Image"><div class="product-name">Product 19</div></div>
                    <div class="product-card"><img src="product20" alt="Product Image"><div class="product-name">Product 20</div></div>
                    <!-- ... more products ... -->
                </div>
            </div>
            <div class="face left">
                <div class="product-grid">
                    <div class="product-card"><img src="product33" alt="Product Image"><div class="product-name">Product 33</div></div>
                    <div class="product-card"><img src="product34" alt="Product Image"><div class="product-name">Product 34</div></div>
                    <!-- ... more products ... -->
                </div>
            </div>
            <div class="face right">
                <div class="product-grid">
                    <div class="product-card"><img src="product49" alt="Product Image"><div class="product-name">Product 49</div></div>
                    <div class="product-card"><img src="product50" alt="Product Image"><div class="product-name">Product 50</div></div>
                    <!-- ... more products ... -->
                </div>
            </div>
        </div>
    </div>
    <!-- ... script.js for interactivity ... -->
</body>
</html>
